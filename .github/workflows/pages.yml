name: Deploy WebApp (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Copia lettore PDF
        run: |
          mkdir -p www/lib
          cp node_modules/pdfjs-dist/legacy/build/pdf.mjs www/lib/pdf.js
          cp node_modules/pdfjs-dist/legacy/build/pdf.worker.mjs www/lib/pdf.worker.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deployment
        uses: actions/deploy-pages@v4
