function mkParserP(){
 const TYPES=['Normal','Fire','Water','Grass','Electric','Ice','Fighting','Poison','Ground','Flying','Psychic','Bug','Rock','Ghost','Dragon','Dark','Steel','Fairy'];
 const TS=new Set(TYPES.concat(['Fight']));const tyN=x=>{x=String(x).trim();return x=='Fight'?'Fighting':x};
 const PG=[],LN=[],DEX=[];let DBG=null;
 const fx=s=>String(s||'').replace(/\s+/g,' ').trim();
 // ---------- Pokédex ----------
 function dex(items,paths,pn){
  const A=items.filter(i=>i.str==='Type:'||/^Type:\s*$/.test(i.str)).sort((a,b)=>b.y-a.y);
  A.forEach((an,k)=>{
   const top=an.y+24,bot=k+1<A.length?A[k+1].y+24:-1;
   const B=items.filter(i=>i.y<=top&&i.y>bot&&i.y>34&&i.str.trim()!=='');
   const USED=new Set();
   const P=paths.filter(p=>p.y1<=top+2&&p.y0>bot-2);
   const e={p:pn,n:'',dex:'',ty:[],at:{},mx:{},hp:0,h:'',w:'',cat:'',d:'',ab:[],rank:'',evo:'',chain:[],mv:[]};
   // titolo
   const tl=B.filter(i=>Math.abs(i.y-an.y)<=6&&i.h>=15&&i.x<an.x).sort((a,b)=>a.x-b.x);
   let tt=tl.map(i=>i.str).join(' ').replace(/\s+/g,' ').trim();
   const m=/^#\s*(\d+)\s*(.*)$/.exec(tt);if(m){e.dex=m[1];e.n=m[2].trim()}else e.n=tt;
   if(!tl.length){const t2=B.filter(i=>Math.abs(i.y-an.y)<=6&&i.h>=15).sort((a,b)=>a.x-b.x).map(i=>i.str).join(' ');const m2=/^#\s*(\d+)\s*(.*)$/.exec(t2);if(m2){e.dex=m2[1];e.n=m2[2].trim()}else e.n=t2.trim()}
   // tipi
   e.ty=B.filter(i=>Math.abs(i.y-an.y)<=6&&i.x>an.x&&TS.has(i.str.trim())).sort((a,b)=>a.x-b.x).map(i=>tyN(i.str));
   // attributi (pallini)
   const KEYS=['FOR','DES','VIT','SPE','INS'];
   const dd=P.filter(p=>p.y0<=an.y-4&&p.y0>=an.y-115&&(p.x1-p.x0)>=4&&(p.x1-p.x0)<=9&&(p.y1-p.y0)>=4&&(p.y1-p.y0)<=9&&Math.abs((p.x1-p.x0)-(p.y1-p.y0))<0.6);
   const st=dd.filter(p=>p.x0>=an.x+52&&p.x0<=an.x+74).sort((a,b)=>b.y0-a.y0),rowsD=[];
   st.forEach(p=>{if(!rowsD.some(r=>Math.abs(r.y-p.y0)<3))rowsD.push({y:p.y0,x:p.x0})});
   rowsD.sort((a,b)=>b.y-a.y);
   if(rowsD.length>=5){rowsD.slice(0,5).forEach((r,i)=>{const row=dd.filter(p=>Math.abs(p.y0-r.y)<2.5&&p.x0>=r.x-1).sort((a,b)=>a.x0-b.x0);const ch=[];let px=null;for(const p of row){if(px===null||(p.x0-px<9.5&&p.x0-px>3)){if(px===null||p.x0-px>3){ch.push(p);px=p.x0}}else if(p.x0-px>=9.5)break}
    e.at[KEYS[i]]=ch.filter(p=>!/^#ffffff$/i.test(p.c)).length;e.mx[KEYS[i]]=ch.length})}
   // HP base
   const hp=B.find(i=>i.h>=22&&i.h<=26&&/^\d+$/.test(i.str.trim()));if(hp)e.hp=+hp.str.trim();
   // mosse: righe tipo+nome
   const typ=B.filter(i=>TS.has(i.str.trim())&&i.h>=8&&i.h<=10&&Math.abs(i.y-an.y)>8);
   typ.forEach(t=>{const nm=B.filter(i=>Math.abs(i.y-t.y)<=2&&i.x>t.x+t.w-2&&i.x<t.x+t.w+60&&i.str.trim()&&!TS.has(i.str.trim())&&i.h>=8&&i.h<=10).sort((a,b)=>a.x-b.x);
    if(!nm.length)return;const name=fx(nm.map(i=>i.str).join(' '));
    const cx=t.x+t.w/2,ic=P.filter(p=>p.x0>=cx-58&&p.x1<=cx-14&&(p.y0+p.y1)/2>=t.y-1&&(p.y0+p.y1)/2<=t.y+8&&(p.x1-p.x0)<14);
    USED.add(t);nm.forEach(i=>USED.add(i));e.mv.push({n:name,t:tyN(t.str),r:rankOf(ic),x:t.x,y:t.y})});
   // altezza/peso
   const hl=B.find(i=>/^Height:/.test(i.str)),wl=B.find(i=>/^Weight:/.test(i.str));
   if(hl){const v=B.filter(i=>i.y<hl.y&&hl.y-i.y<24&&i.x>=hl.x-6&&(!wl||Math.abs(i.x-hl.x)<=Math.abs(i.x-wl.x))&&i.h>=9&&i.h<=12.5&&!USED.has(i)).sort((a,b)=>b.y-a.y||a.x-b.x);if(v.length)e.h=fx(v.map(i=>i.str).join(' '))}
   if(wl){const v=B.filter(i=>i.y<wl.y&&wl.y-i.y<24&&i.x>=wl.x-8&&(!hl||Math.abs(i.x-wl.x)<Math.abs(i.x-hl.x))&&i.x<wl.x+80&&i.h>=9&&i.h<=12.5&&!USED.has(i)).sort((a,b)=>b.y-a.y||a.x-b.x);if(v.length)e.w=fx(v.map(i=>i.str).join(' '))}
   const ab=B.find(i=>/^Abilities:/.test(i.str)),evl=B.find(i=>/^EVOLUTIVE/i.test(i.str)),sr=B.find(i=>/^Suggested Rank/.test(i.str));
   if(sr){const v=B.filter(i=>i.y<sr.y&&sr.y-i.y<22&&i.x>=sr.x-8&&i.x<sr.x+70&&i.h>=9&&i.h<=13&&!USED.has(i)).sort((a,b)=>b.y-a.y)[0];if(v)e.rank=fx(v.str)}
   if(ab){const lim=evl?evl.y:ab.y-40;const v=B.filter(i=>i.y<ab.y-1&&i.y>lim+1&&i.x>=ab.x-6&&i.h>=10&&!USED.has(i)).sort((a,b)=>b.y-a.y||a.x-b.x);e.abt=fx(v.map(i=>i.str).join(' '))}
   if(evl){const v=B.filter(i=>i.y<=evl.y+3&&i.y>evl.y-24&&i.x>=evl.x-3&&i.x<evl.x+170&&i.h>=8&&i.h<=10&&!USED.has(i)).sort((a,b)=>b.y-a.y||a.x-b.x);e.evo=fx(v.map(i=>i.str).join(' '))}
   e.chain=B.filter(i=>i.h>=6&&i.h<=8&&/^#\d+$/.test(i.str.trim())&&(!evl||i.y<evl.y)).sort((a,b)=>a.x-b.x).map(i=>i.str.trim().slice(1));
   // descrizione: colonna info (sotto Height)
   if(hl&&ab){const x0=hl.x-3,x1=ab.x-6,yt=hl.y-22;
    const v=B.filter(i=>i.y<yt&&i.x>=x0&&i.x<x1&&i.h>=8&&i.h<=11.5&&i.y>bot+4&&!USED.has(i)).sort((a,b)=>b.y-a.y||a.x-b.x);
    const rows=[];v.forEach(i=>{const r=rows[rows.length-1];if(r&&Math.abs(r.y-i.y)<2)r.t+=(/^\s|\s$/.test(r.t+i.str)?'':' ')+i.str;else rows.push({y:i.y,t:i.str})});
    const ls=rows.map(r=>fx(r.t)).filter(Boolean);
    if(ls.length){e.cat=ls[0];e.d=ls.slice(1).join(' ')}}
   e.mv.sort((a,b)=>b.y-a.y||a.x-b.x);e.mv.forEach(m=>{delete m.x;delete m.y});
   if(DBG)DBG.push([pn,e.n,e.hp,Object.keys(e.at).length,e.mv.length,Object.values(e.mx).join('')]);
   if(e.n&&e.hp>0&&Object.keys(e.at).length>=4&&e.mv.length)DEX.push(e)})}
 const RANKS=['Starter','Beginner','Amateur','Ace','Pro','Master','Champion'];
 function hue(c){const m=/^#([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(c);if(!m)return null;const r=parseInt(m[1],16)/255,g=parseInt(m[2],16)/255,b=parseInt(m[3],16)/255,mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;if(mx<0.15||d/(mx||1)<0.4)return null;let h;if(mx==r)h=((g-b)/d)%6;else if(mx==g)h=(b-r)/d+2;else h=(r-g)/d+4;h*=60;return h<0?h+360:h}
 function rankOf(ic){if(!ic.length)return -1;const hs=ic.map(p=>hue(p.c)).filter(h=>h!==null);
  if(hs.some(h=>h>=95&&h<=175))return 4;if(hs.some(h=>h>=38&&h<=70))return 3;if(hs.some(h=>h>=185&&h<=240))return 2;
  if(hs.some(h=>h<25||h>335))return ic.length>=10?5:1;return 0}
 // ---------- righe di testo ----------
 function lines(items,pn){
  let its=items.filter(i=>i.str&&i.str.trim()&&i.h>=3);if(its.length<3)return;
  {const kept=[];for(const it of its){let done=false;for(let q=0;q<kept.length;q++){const o=kept[q];if(Math.abs(o.x-it.x)>2||Math.abs(o.y-it.y)>1)continue;
     if(o.str===it.str||o.str.startsWith(it.str)){done=true;break}
     if(it.str.startsWith(o.str)||(o.f==it.f&&/^\s*:/.test(it.str)&&/^\s*:/.test(o.str))){kept[q]=it;done=true;break}}
    if(!done)kept.push(it)}its=kept}
  if(HDR[pn]=='M'){const lf=[0,0];[0,1].forEach(c=>{const xs=its.filter(i=>(c?i.x>=302:i.x<302)&&i.h<9&&i.h>5).map(i=>i.x);lf[c]=xs.length?Math.min.apply(null,xs):(c?316:20)});
   its=its.filter(i=>{const cl=lf[i.x<302?0:1];if(i.h>=16.5&&/^[\dx]$/.test(i.str.trim())&&i.x>cl+100)return false;if(i.h>=9.15&&i.h<=9.45&&i.x>cl+130&&i.str.trim().length<18&&!/^POWER$/.test(i.str.trim()))return false;return i.x<cl+182||/^POWER$/.test(i.str.trim())||(i.h>=13.4&&i.h<=15.6&&/^[\dx\-–]+$/.test(i.str.trim()))})}
  const W=612,split=W/2,L=[];
  [its.filter(i=>i.x<split-4),its.filter(i=>i.x>=split-4)].forEach((ci,c)=>{
   ci.sort((a,b)=>b.y-a.y||a.x-b.x);const rows=[];
   for(const it of ci){const r=rows[rows.length-1];if(r&&Math.abs(r.y-it.y)<=Math.max(2,.4*Math.max(it.h,r.h||0)))r.its.push(it);else rows.push({y:it.y,h:it.h,its:[it]})}
   for(const r of rows){r.its.sort((a,b)=>a.x-b.x);let t='',pe=null;for(const it of r.its){if(pe!==null&&it.x-pe>.15*it.h&&!/\s$/.test(t)&&!/^\s/.test(it.str))t+=' ';t+=it.str;pe=it.x+(it.w||0)}
    t=fx(t);if(!t)continue;LN.push({t,p:pn,c,y:r.y,x:r.its[0].x,h:Math.max.apply(null,r.its.map(i=>i.h)),xs:r.its})}});
 }
 const HDR={};
 function page(items,paths,pn){PG.push(pn);const hd=items.filter(i=>i.h>=13&&i.h<=15&&i.y>900).map(i=>i.str.trim());if(hd.includes('Moves'))HDR[pn]='M';else if(hd.includes('Abilities'))HDR[pn]='A';else if(hd.includes('Master')&&hd.includes('Game'))HDR[pn]='G';try{dex(items,paths||[],pn)}catch(e){}lines(items,pn)}
 // ---------- mosse ----------
 const TAILD=/^(?:Type)+\s*:\s*(.*?)(?:\s+(?:Category)+\s*:\s*(.*))?$/i;
 function moves(){const out=[],seen=new Set();
  for(let i=1;i<LN.length-3;i++){const m=TAILD.exec(LN[i].t);if(!m)continue;

   if(!cat){if(/^Accuracy/i.test((LN[j]||{}).t||'')){cat='?'}else continue}

   if(cat=='?')cat=(pw=='-'?'Support':'');const mv={n:fx(n0.xs.filter(x=>x.h>=15).map(x=>x.str).join(' ')).replace(/^Name\s*/,''),pw,ty:fx(m[1]),cat:fx(cat),ac:'',dm:'',ef:'',d:'',p:n0.p};
   if(!mv.n||/^POWER$/i.test(mv.n))continue;
   let eff=[],fl=[],mode='';
   for(;j<LN.length;j++){const l=LN[j];if(l.p!=n0.p||l.c!=n0.c)break;if(l.h>=15)break;
    let r;
    if(r=/^Accuracy\s*:\s*(.*)/i.exec(l.t)){mv.ac=r[1];mode='ac';continue}
    if(r=/^Damage Pool\s*:\s*(.*)/i.exec(l.t)){mv.dm=r[1];mode='dm';continue}

   mv.ef=fx(eff.join(' '));mv.d=fx(fl.join(' ')).replace(/^Move Description\s*/,'');

   const txt=ps.join(' ').replace(/ ?\n ?/g,'\n').trim();const parts=txt.split('\n').filter(Boolean);
   const k=cur.n.toLowerCase();if(parts.length&&!seen.has(k)&&!/^(Rules for|How to Read|Basic Rules|Hidden Abilities|Ignoring|Form-changing)/i.test(cur.n)){seen.add(k);out.push({n:cur.n,d:parts[0],ef:parts.slice(1).join(' '),tag:fx(cur.tag.join(' ')),p:cur.p})}}cur=null};

function pathsFromOps(ol,O){const mul=(a,b)=>[a[0]*b[0]+a[2]*b[1],a[1]*b[0]+a[3]*b[1],a[0]*b[2]+a[2]*b[3],a[1]*b[2]+a[3]*b[3],a[0]*b[4]+a[2]*b[5]+a[4],a[1]*b[4]+a[3]*b[5]+a[5]];
 let ctm=[1,0,0,1,0,0],st=[],col='#000000';const P=[];
 for(let i=0;i<ol.fnArray.length;i++){const f=ol.fnArray[i],a=ol.argsArray[i];
  if(f==O.save)st.push(ctm.slice());else if(f==O.restore){if(st.length)ctm=st.pop()}else if(f==O.transform)ctm=mul(ctm,a);
  else if(f==O.paintFormXObjectBegin){st.push(ctm.slice());if(a&&a[0])ctm=mul(ctm,a[0])}else if(f==O.paintFormXObjectEnd){if(st.length)ctm=st.pop()}
  else if(f==O.setFillRGBColor)col=hexc(a);

   if(a[2]&&a[2].length>=4){add(a[2][0],a[2][1]);add(a[2][2],a[2][3])}
   else if(Array.isArray(a[0])){const c=a[1];for(let k=0;k+1<c.length;k+=2)add(c[k],c[k+1])}
   else{const b=a[1]&&a[1][0];if(b){let k=0;while(k<b.length){const o=b[k++];if(o===0||o===1){add(b[k],b[k+1]);k+=2}else if(o===2){add(b[k],b[k+1]);add(b[k+4],b[k+5]);k+=6}else if(o!==3)break}}}
   if(x0>1e8)continue;const p=[[x0,y0],[x1,y1]].map(([x,y])=>[ctm[0]*x+ctm[2]*y+ctm[4],ctm[1]*x+ctm[3]*y+ctm[5]]);
   const w=Math.abs(p[1][0]-p[0][0]),h=Math.abs(p[1][1]-p[0][1]);if(w<24&&h<24)P.push({c:col,x0:Math.min(p[0][0],p[1][0]),x1:Math.max(p[0][0],p[1][0]),y0:Math.min(p[0][1],p[1][1]),y1:Math.max(p[0][1],p[1][1])})}}

async function readPdf(f,st){
 const pdf=await pdfjsLib.getDocument({data:new Uint8Array(await f.arrayBuffer())}).promise,P=mkParserP(),O=pdfjsLib.OPS;
 for(let n=1;n<=pdf.numPages;n++){if(st)st.textContent='Pagina '+n+' di '+pdf.numPages+'…';
  const pg=await pdf.getPage(n),tc=await pg.getTextContent();
  const its=tc.items.filter(t=>t.str!==undefined&&t.transform).map(t=>({str:t.str,x:t.transform[4],y:t.transform[5],h:Math.hypot(t.transform[2],t.transform[3]),w:t.width||0,f:t.fontName}));
  let paths=[];if(n>=100&&its.some(i=>i.str.includes('Type:'))&&its.some(i=>/^Type:/.test(i.str))){try{paths=pathsFromOps(await pg.getOperatorList(),O)}catch(e){}}
  try{P.page(its,paths,n)}catch(e){}
  try{pg.cleanup()}catch(e){}
  if(n%8==0)await new Promise(r=>setTimeout(r,0))}
 return P.result()}
const mrg=(a,b,s,key)=>{const m=new Map((a||[]).map(x=>[key(x),x]));for(const x of b){x.s=s;m.set(key(x),x)}return[...m.values()]};

 const st=document.getElementById('imps'),out=[];

    if(!n&&!r.book.length){out.push(f.name+': nessun contenuto riconosciuto (formato diverso dal manuale PokéRole).');continue}

 else if(a=='ref'){refK=k;FLT=''}

 else if(a=='aadd')c.ach.push({t:'',d:0});else if(a=='adel')c.ach.splice(i,1);

 else if(a=='applysp'){const e=SP(c);if(e)applySp(c,e)}

  else{const p=pool(c,m.dm,stab?1:0);const net=roll(m.n+' · Danno',p.n,0,p.vit?0:pen);const bar=document.getElementById('rollbar');bar.innerHTML+=' · <b>Danno inflitto: '+Math.max(1,net)+'</b> (prima di difese e tipi)'}return}
 else if(a=='gadd'){const n=document.getElementById('gn').value.trim();if(!n)return;const hp=+document.getElementById('gh').value||0,w=+document.getElementById('gw').value||0;g.list.push({n,init:+document.getElementById('gi').value||0,hp,hpm:hp,wp:w,wpm:w,cond:[],note:'',act:0})}
